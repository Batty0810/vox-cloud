    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames

      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // DOMParser/replaceWith are inert per spec Ã¢â‚¬â€ re-create each with

    // degraded state as a refused embed.

        if (typeof text === 'string') {

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"566f8802-364f-4dbf-bb67-b622c888817d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =========================================================================\n   Nymbis Design System Ã¢â‚¬â€ Colors & Type\n   -------------------------------------------------------------------------\n   Derived from Nymbis Brand Guide (v2, 04-07-23) and product logo suites\n   for Nymbis (parent), Cuumulo (AI chatbot) and PortKey (product).\n\n   Primary typeface: Encode Sans Semi Expanded (Google Fonts)\n   Display / headings: Encode Sans Expanded (Medium), per brand guide\n   ========================================================================= */\n\n/* ---------- FONTS --------------------------------------------------------- */\n/* Variable font covers wght + wdth axes; we use wdth ~112 (\"SemiExpanded\")\n   per the brand guide. Expanded-Medium is used as the display cut.         */\n\n@font-face {\n  font-family: 'Encode Sans';\n  src: url(\"deee465d-a02d-4a8d-81f3-08be42c85d70\") format('truetype-variations');\n  font-weight: 100 900;\n  font-stretch: 75% 125%;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: 'Encode Sans Expanded';\n  src: url(\"ec3a8a82-0903-4f2e-872e-0d36518222ef\") format('truetype');\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- COLOR TOKENS -------------------------------------------------- */\n:root {\n  /* === Brand core (official Nymbis palette) ===\n     The digital Nymbis brand is anchored by dark plum (#900080 primary)\n     with a warm orangeÃ¢â€ â€™pink gradient family for accent/creative. */\n\n  /* Primary */\n  --nymbis-plum:           #900080;   /* PRIMARY Ã¢â‚¬â€ the Nymbis dark plum     */\n  --nymbis-fuchsia:        #9D0081;   /* Fuchsia Purple Ã¢â‚¬â€ close sibling     */\n  --nymbis-plum-deep:      #420A38;   /* Pantone 262 C Ã¢â‚¬â€ deep plum          */\n\n  /* Warm accent ramp, darkest Ã¢â€ â€™ lightest */\n  --nymbis-red:            #FF1A40;   /* Pantone 192 C Ã¢â‚¬â€ cherry red         */\n  --nymbis-orange-red:     #FF583C;   /* Orange-Red                         */\n  --nymbis-salmon:         #FF6980;   /* Salmon Pink                        */\n  --nymbis-soft-pink:      #FF8C9F;   /* Soft Pink                          */\n  --nymbis-light-coral:    #FFA89C;   /* Light Coral                        */\n\n  /* Legacy aliases Ã¢â‚¬â€ keep for backwards compatibility with existing components */\n  --nymbis-cherry:         var(--nymbis-red);\n  --nymbis-orange:         var(--nymbis-orange-red);\n  --nymbis-pink:           var(--nymbis-soft-pink);\n  --nymbis-magenta:        var(--nymbis-red);\n  --nymbis-plum-light:     #B43AA3;\n\n  /* === Gradients (the \"Nymbis Gradient mesh\") === */\n  --nymbis-gradient: linear-gradient(105deg, #FF583C 0%, #FF1A40 55%, #9D0081 100%); /* @kind color */\n  --nymbis-gradient-vert: linear-gradient(180deg, #FF583C 0%, #FF1A40 100%); /* @kind color */\n  --nymbis-gradient-soft: linear-gradient(135deg, #FFA89C 0%, #FF8C9F 100%); /* @kind color */\n  --nymbis-gradient-plum: linear-gradient(135deg, #420A38 0%, #900080 100%); /* @kind color */\n\n  /* === Neutrals === */\n  --ink-0:   #FFFFFF;\n  --ink-50:  #FAF7F9;   /* warmed white Ã¢â‚¬â€ plays well with plum              */\n  --ink-100: #F2EDF1;\n  --ink-200: #E4DBE3;\n  --ink-300: #C9BCC7;\n  --ink-400: #9B8B99;\n  --ink-500: #6E5F6C;\n  --ink-600: #4A3D48;\n  --ink-700: #2E2530;\n  --ink-800: #1B141D;\n  --ink-900: #0D0910;\n\n  /* === Semantic foreground / background === */\n  --fg-1: var(--ink-900);        /* primary body text                        */\n  --fg-2: var(--ink-600);        /* secondary                                */\n  --fg-3: var(--ink-400);        /* muted / helper                           */\n  --fg-on-plum: var(--ink-0);\n  --fg-brand: var(--nymbis-cherry);\n\n  --bg-1: var(--ink-0);          /* default page bg                          */\n  --bg-2: var(--ink-50);\n  --bg-3: var(--ink-100);\n  --bg-plum: var(--nymbis-plum);\n  --bg-plum-deep: var(--nymbis-plum-deep);\n\n  --border-1: var(--ink-200);\n  --border-2: var(--ink-300);\n  --border-strong: var(--ink-600);\n\n  /* === Semantic status =====================================================\n     Only drawn from the Nymbis palette Ã¢â‚¬â€ no outside greens or ambers.\n     The palette has no green, so \"success\" uses Pantone 262 C (deep plum)\n     as a confirmed/committed tone; pair with a check icon for clarity. */\n  --success: #420A38;            /* deep plum Ã¢â‚¬â€ confirmed/committed/stable    */\n  --warning: #FF583C;            /* orange-red Ã¢â‚¬â€ attention, non-blocking      */\n  --danger:  var(--nymbis-red);  /* Pantone 192 C Ã¢â‚¬â€ error, destructive        */\n  --info:    var(--nymbis-plum); /* plum Ã¢â‚¬â€ informational, brand-voiced        */\n\n  /* === Radii === */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* === Elevation / shadow ===\n     Warm, plum-tinted shadows echo the brand palette. */\n  /* === Shadows (two-layer, plum-tinted) ================================\n     Each level combines a tight contact shadow (crisper) with a softer\n     diffuse one Ã¢â‚¬â€ this reads as real elevation, not just a blur.        */\n  --shadow-xs:\n    0 1px 1px rgba(66, 10, 56, 0.06),\n    0 1px 2px rgba(66, 10, 56, 0.04);\n  --shadow-sm:\n    0 1px 2px rgba(66, 10, 56, 0.08),\n    0 4px 10px rgba(66, 10, 56, 0.06);\n  --shadow-md:\n    0 2px 4px rgba(66, 10, 56, 0.10),\n    0 10px 28px rgba(66, 10, 56, 0.12);\n  --shadow-lg:\n    0 4px 8px rgba(66, 10, 56, 0.12),\n    0 24px 56px rgba(66, 10, 56, 0.18);\n  --shadow-xl:\n    0 8px 16px rgba(66, 10, 56, 0.16),\n    0 40px 96px rgba(66, 10, 56, 0.26);\n  --shadow-glow:\n    0 2px 6px rgba(144, 0, 128, 0.22),\n    0 16px 48px rgba(255, 26, 64, 0.38);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);\n\n  /* === Spacing (4px base) === */\n  --sp-0:  0; /* @kind spacing */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n  --sp-32: 128px;\n\n  /* === Motion === */\n  --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n\n  /* === Typography tokens === */\n  --font-sans:    'Encode Sans', system-ui, -apple-system, Segoe UI, sans-serif;\n  --font-display: 'Encode Sans Expanded', 'Encode Sans', system-ui, sans-serif;\n  /* The Nymbis brand uses Encode Sans exclusively Ã¢â‚¬â€ no secondary mono\n     typeface. `--font-mono` resolves to Encode Sans with tabular numerals\n     so code/hex/dimension text stays aligned without leaving the family. */\n  --font-mono:    'Encode Sans', system-ui, -apple-system, Segoe UI, sans-serif;\n\n  /* Variable-font width axis = SemiExpanded (~112)  */\n  --wdth-semi-expanded: 112; /* @kind font */\n\n  /* Type scale Ã¢â‚¬â€ fluid-friendly, 1280px design target */\n  --fs-xs:   12px;\n  --fs-sm:   14px;\n  --fs-base: 16px;\n  --fs-md:   18px;\n  --fs-lg:   20px;\n  --fs-xl:   24px;\n  --fs-2xl:  32px;\n  --fs-3xl:  40px;\n  --fs-4xl:  56px;\n  --fs-5xl:  72px;\n  --fs-6xl:  96px;\n\n  --lh-tight:  1.08; /* @kind font */\n  --lh-snug:   1.22; /* @kind font */\n  --lh-normal: 1.45; /* @kind font */\n  --lh-loose:  1.65; /* @kind font */\n\n  --ls-tight:   -0.02em; /* @kind font */\n  --ls-normal:   0; /* @kind font */\n  --ls-wide:     0.04em; /* @kind font */\n  --ls-caps:     0.12em; /* @kind font */\n}\n\n/* ---------- TYPOGRAPHY ROLES --------------------------------------------- */\n/* Base body */\nhtml { font-family: var(--font-sans); font-variation-settings: 'wdth' var(--wdth-semi-expanded); }\nbody { color: var(--fg-1); background: var(--bg-1); font-size: var(--fs-base); line-height: var(--lh-normal); }\n\n/* Semantic text utility classes */\n.display-xl,\nh1.display {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n}\n\n.h1, h1 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 700;\n  font-weight: 700;\n  font-size: var(--fs-4xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n}\n\n.h2, h2 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 700;\n  font-weight: 700;\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n}\n\n.h3, h3 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-2xl);\n  line-height: var(--lh-snug);\n}\n\n.h4, h4 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n}\n\n.h5, h5 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-lg);\n  line-height: var(--lh-snug);\n}\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-sm);\n  text-transform: uppercase;\n  letter-spacing: var(--ls-caps);\n  color: var(--nymbis-cherry);\n}\n\n.lede {\n  font-size: var(--fs-lg);\n  line-height: var(--lh-normal);\n  color: var(--fg-2);\n}\n\np { font-size: var(--fs-base); line-height: var(--lh-normal); color: var(--fg-1); text-wrap: pretty; }\n.small, small { font-size: var(--fs-sm); color: var(--fg-2); }\n.caption { font-size: var(--fs-xs); color: var(--fg-3); letter-spacing: var(--ls-wide); }\n\ncode, kbd, .mono {\n  font-family: var(--font-mono);\n  font-feature-settings: 'tnum' 1, 'zero' 1;     /* tabular + slashed zero */\n  font-size: 0.92em;\n  background: var(--bg-3);\n  padding: 2px 6px;\n  border-radius: var(--radius-xs);\n}\n\n/* Gradient text (the \"gradient mesh copy treatment\" from the brand guide) */\n.gradient-text {\n  background: var(--nymbis-gradient);\n  -webkit-background-clip: text;\n          background-clip: text;\n  -webkit-text-fill-color: transparent;\n          color: transparent;\n}\n\n/* Focus ring */\n:where(button, a, input, textarea, select, [role=\"button\"]):focus-visible {\n  outline: 2px solid var(--nymbis-cherry);\n  outline-offset: 2px;\n  border-radius: var(--radius-xs);\n}\n<\u002Fstyle>\n<style>/* =========================================================================\n   Nymbis Design System Ã¢â‚¬â€ root stylesheet\n   Consumers link THIS file; it pulls in every layer of the system.\n   ========================================================================= */\n\n/* =========================================================================\n   Nymbis Design System Ã¢â‚¬â€ Colors & Type\n   -------------------------------------------------------------------------\n   Derived from Nymbis Brand Guide (v2, 04-07-23) and product logo suites\n   for Nymbis (parent), Cuumulo (AI chatbot) and PortKey (product).\n\n   Primary typeface: Encode Sans Semi Expanded (Google Fonts)\n   Display / headings: Encode Sans Expanded (Medium), per brand guide\n   ========================================================================= */\n\n/* ---------- FONTS --------------------------------------------------------- */\n/* Variable font covers wght + wdth axes; we use wdth ~112 (\"SemiExpanded\")\n   per the brand guide. Expanded-Medium is used as the display cut.         */\n\n@font-face {\n  font-family: 'Encode Sans';\n  src: url(\"deee465d-a02d-4a8d-81f3-08be42c85d70\") format('truetype-variations');\n  font-weight: 100 900;\n  font-stretch: 75% 125%;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: 'Encode Sans Expanded';\n  src: url(\"ec3a8a82-0903-4f2e-872e-0d36518222ef\") format('truetype');\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- COLOR TOKENS -------------------------------------------------- */\n:root {\n  /* === Brand core (official Nymbis palette) ===\n     The digital Nymbis brand is anchored by dark plum (#900080 primary)\n     with a warm orangeÃ¢â€ â€™pink gradient family for accent/creative. */\n\n  /* Primary */\n  --nymbis-plum:           #900080;   /* PRIMARY Ã¢â‚¬â€ the Nymbis dark plum     */\n  --nymbis-fuchsia:        #9D0081;   /* Fuchsia Purple Ã¢â‚¬â€ close sibling     */\n  --nymbis-plum-deep:      #420A38;   /* Pantone 262 C Ã¢â‚¬â€ deep plum          */\n\n  /* Warm accent ramp, darkest Ã¢â€ â€™ lightest */\n  --nymbis-red:            #FF1A40;   /* Pantone 192 C Ã¢â‚¬â€ cherry red         */\n  --nymbis-orange-red:     #FF583C;   /* Orange-Red                         */\n  --nymbis-salmon:         #FF6980;   /* Salmon Pink                        */\n  --nymbis-soft-pink:      #FF8C9F;   /* Soft Pink                          */\n  --nymbis-light-coral:    #FFA89C;   /* Light Coral                        */\n\n  /* Legacy aliases Ã¢â‚¬â€ keep for backwards compatibility with existing components */\n  --nymbis-cherry:         var(--nymbis-red);\n  --nymbis-orange:         var(--nymbis-orange-red);\n  --nymbis-pink:           var(--nymbis-soft-pink);\n  --nymbis-magenta:        var(--nymbis-red);\n  --nymbis-plum-light:     #B43AA3;\n\n  /* === Gradients (the \"Nymbis Gradient mesh\") === */\n  --nymbis-gradient: linear-gradient(105deg, #FF583C 0%, #FF1A40 55%, #9D0081 100%); /* @kind color */\n  --nymbis-gradient-vert: linear-gradient(180deg, #FF583C 0%, #FF1A40 100%); /* @kind color */\n  --nymbis-gradient-soft: linear-gradient(135deg, #FFA89C 0%, #FF8C9F 100%); /* @kind color */\n  --nymbis-gradient-plum: linear-gradient(135deg, #420A38 0%, #900080 100%); /* @kind color */\n\n  /* === Neutrals === */\n  --ink-0:   #FFFFFF;\n  --ink-50:  #FAF7F9;   /* warmed white Ã¢â‚¬â€ plays well with plum              */\n  --ink-100: #F2EDF1;\n  --ink-200: #E4DBE3;\n  --ink-300: #C9BCC7;\n  --ink-400: #9B8B99;\n  --ink-500: #6E5F6C;\n  --ink-600: #4A3D48;\n  --ink-700: #2E2530;\n  --ink-800: #1B141D;\n  --ink-900: #0D0910;\n\n  /* === Semantic foreground / background === */\n  --fg-1: var(--ink-900);        /* primary body text                        */\n  --fg-2: var(--ink-600);        /* secondary                                */\n  --fg-3: var(--ink-400);        /* muted / helper                           */\n  --fg-on-plum: var(--ink-0);\n  --fg-brand: var(--nymbis-cherry);\n\n  --bg-1: var(--ink-0);          /* default page bg                          */\n  --bg-2: var(--ink-50);\n  --bg-3: var(--ink-100);\n  --bg-plum: var(--nymbis-plum);\n  --bg-plum-deep: var(--nymbis-plum-deep);\n\n  --border-1: var(--ink-200);\n  --border-2: var(--ink-300);\n  --border-strong: var(--ink-600);\n\n  /* === Semantic status =====================================================\n     Only drawn from the Nymbis palette Ã¢â‚¬â€ no outside greens or ambers.\n     The palette has no green, so \"success\" uses Pantone 262 C (deep plum)\n     as a confirmed/committed tone; pair with a check icon for clarity. */\n  --success: #420A38;            /* deep plum Ã¢â‚¬â€ confirmed/committed/stable    */\n  --warning: #FF583C;            /* orange-red Ã¢â‚¬â€ attention, non-blocking      */\n  --danger:  var(--nymbis-red);  /* Pantone 192 C Ã¢â‚¬â€ error, destructive        */\n  --info:    var(--nymbis-plum); /* plum Ã¢â‚¬â€ informational, brand-voiced        */\n\n  /* === Radii === */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* === Elevation / shadow ===\n     Warm, plum-tinted shadows echo the brand palette. */\n  /* === Shadows (two-layer, plum-tinted) ================================\n     Each level combines a tight contact shadow (crisper) with a softer\n     diffuse one Ã¢â‚¬â€ this reads as real elevation, not just a blur.        */\n  --shadow-xs:\n    0 1px 1px rgba(66, 10, 56, 0.06),\n    0 1px 2px rgba(66, 10, 56, 0.04);\n  --shadow-sm:\n    0 1px 2px rgba(66, 10, 56, 0.08),\n    0 4px 10px rgba(66, 10, 56, 0.06);\n  --shadow-md:\n    0 2px 4px rgba(66, 10, 56, 0.10),\n    0 10px 28px rgba(66, 10, 56, 0.12);\n  --shadow-lg:\n    0 4px 8px rgba(66, 10, 56, 0.12),\n    0 24px 56px rgba(66, 10, 56, 0.18);\n  --shadow-xl:\n    0 8px 16px rgba(66, 10, 56, 0.16),\n    0 40px 96px rgba(66, 10, 56, 0.26);\n  --shadow-glow:\n    0 2px 6px rgba(144, 0, 128, 0.22),\n    0 16px 48px rgba(255, 26, 64, 0.38);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);\n\n  /* === Spacing (4px base) === */\n  --sp-0:  0; /* @kind spacing */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n  --sp-32: 128px;\n\n  /* === Motion === */\n  --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n\n  /* === Typography tokens === */\n  --font-sans:    'Encode Sans', system-ui, -apple-system, Segoe UI, sans-serif;\n  --font-display: 'Encode Sans Expanded', 'Encode Sans', system-ui, sans-serif;\n  /* The Nymbis brand uses Encode Sans exclusively Ã¢â‚¬â€ no secondary mono\n     typeface. `--font-mono` resolves to Encode Sans with tabular numerals\n     so code/hex/dimension text stays aligned without leaving the family. */\n  --font-mono:    'Encode Sans', system-ui, -apple-system, Segoe UI, sans-serif;\n\n  /* Variable-font width axis = SemiExpanded (~112)  */\n  --wdth-semi-expanded: 112; /* @kind font */\n\n  /* Type scale Ã¢â‚¬â€ fluid-friendly, 1280px design target */\n  --fs-xs:   12px;\n  --fs-sm:   14px;\n  --fs-base: 16px;\n  --fs-md:   18px;\n  --fs-lg:   20px;\n  --fs-xl:   24px;\n  --fs-2xl:  32px;\n  --fs-3xl:  40px;\n  --fs-4xl:  56px;\n  --fs-5xl:  72px;\n  --fs-6xl:  96px;\n\n  --lh-tight:  1.08; /* @kind font */\n  --lh-snug:   1.22; /* @kind font */\n  --lh-normal: 1.45; /* @kind font */\n  --lh-loose:  1.65; /* @kind font */\n\n  --ls-tight:   -0.02em; /* @kind font */\n  --ls-normal:   0; /* @kind font */\n  --ls-wide:     0.04em; /* @kind font */\n  --ls-caps:     0.12em; /* @kind font */\n}\n\n/* ---------- TYPOGRAPHY ROLES --------------------------------------------- */\n/* Base body */\nhtml { font-family: var(--font-sans); font-variation-settings: 'wdth' var(--wdth-semi-expanded); }\nbody { color: var(--fg-1); background: var(--bg-1); font-size: var(--fs-base); line-height: var(--lh-normal); }\n\n/* Semantic text utility classes */\n.display-xl,\nh1.display {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n}\n\n.h1, h1 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 700;\n  font-weight: 700;\n  font-size: var(--fs-4xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n}\n\n.h2, h2 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 700;\n  font-weight: 700;\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n}\n\n.h3, h3 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-2xl);\n  line-height: var(--lh-snug);\n}\n\n.h4, h4 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n}\n\n.h5, h5 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-lg);\n  line-height: var(--lh-snug);\n}\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-variation-settings: 'wdth' var(--wdth-semi-expanded), 'wght' 600;\n  font-weight: 600;\n  font-size: var(--fs-sm);\n  text-transform: uppercase;\n  letter-spacing: var(--ls-caps);\n  color: var(--nymbis-cherry);\n}\n\n.lede {\n  font-size: var(--fs-lg);\n  line-height: var(--lh-normal);\n  color: var(--fg-2);\n}\n\np { font-size: var(--fs-base); line-height: var(--lh-normal); color: var(--fg-1); text-wrap: pretty; }\n.small, small { font-size: var(--fs-sm); color: var(--fg-2); }\n.caption { font-size: var(--fs-xs); color: var(--fg-3); letter-spacing: var(--ls-wide); }\n\ncode, kbd, .mono {\n  font-family: var(--font-mono);\n  font-feature-settings: 'tnum' 1, 'zero' 1;     /* tabular + slashed zero */\n  font-size: 0.92em;\n  background: var(--bg-3);\n  padding: 2px 6px;\n  border-radius: var(--radius-xs);\n}\n\n/* Gradient text (the \"gradient mesh copy treatment\" from the brand guide) */\n.gradient-text {\n  background: var(--nymbis-gradient);\n  -webkit-background-clip: text;\n          background-clip: text;\n  -webkit-text-fill-color: transparent;\n          color: transparent;\n}\n\n/* Focus ring */\n:where(button, a, input, textarea, select, [role=\"button\"]):focus-visible {\n  outline: 2px solid var(--nymbis-cherry);\n  outline-offset: 2px;\n  border-radius: var(--radius-xs);\n}\n\n<\u002Fstyle>\n<script src=\"ae7b7031-60e6-49e7-9e69-d80931e065ef\"><\u002Fscript>\n<style>\nbody{margin:0;background:var(--bg-2);-webkit-font-smoothing:antialiased}\na{color:var(--nymbis-plum);text-decoration:none}\na:hover{color:var(--nymbis-red);text-decoration:underline}\ntable{border-collapse:collapse;width:100%}\nth{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-variation-settings:'wdth' 112,'wght' 600;color:var(--fg-3);padding:0 14px 9px;white-space:nowrap}\ntd{padding:var(--rp,13px) 14px;font-size:14px;border-top:1px solid var(--border-1);vertical-align:middle;white-space:nowrap}\ntbody tr:hover td{background:var(--bg-2)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;min-height:100vh;font-family:var(--font-sans);color:var(--fg-1);--rp:{{ rowPad }}\">\n  <aside style=\"width:238px;flex:none;background:var(--nymbis-plum-deep);padding:26px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;align-self:flex-start;height:100vh;box-sizing:border-box\">\n    <img src=\"260e1ff9-17d1-4948-9f4a-3d7b5133b5d7\" alt=\"Nymbis\" style=\"width:118px;height:auto;margin:2px 6px 0\">\n    <div style=\"display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;border-radius:var(--radius-md)\">\n      <img src=\"779ace97-4fba-4404-8065-a52895e9d865\" alt=\"Vox\" style=\"width:52px;height:auto;flex:none\">\n      <span style=\"display:flex;flex-direction:column;line-height:1.25\">\n        <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-variation-settings:'wdth' 112,'wght' 600\">Reseller<\u002Fspan>\n        <span style=\"font-size:13px;color:var(--fg-1);font-variation-settings:'wdth' 112,'wght' 600\">Vox<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:3px\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ n.go }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-variation-settings:'wdth' 112,'wght' 600;color:{{ n.fg }};background:{{ n.bg }};transition:background 200ms var(--ease-out)\">\n          <span style=\"width:3px;height:14px;border-radius:2px;flex:none;background:{{ n.bar }}\"><\u002Fspan>\n          <span style=\"flex:1\">{{ n.label }}<\u002Fspan>\n          <span style=\"font-size:11px;font-variation-settings:'wdth' 112,'wght' 600;color:rgba(255,255,255,.5)\">{{ n.count }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid rgba(255,255,255,.12)\">\n      <span style=\"width:30px;height:30px;border-radius:999px;flex:none;background:var(--nymbis-gradient);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-variation-settings:'wdth' 112,'wght' 700\">TM<\u002Fspan>\n      <span style=\"display:flex;flex-direction:column;line-height:1.3;min-width:0\">\n        <span style=\"font-size:12.5px;color:#fff;font-variation-settings:'wdth' 112,'wght' 600\">Thandi Mokoena<\u002Fspan>\n        <span style=\"font-size:11px;color:rgba(255,255,255,.5)\">Nymbis channel<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"background:#fff;border-bottom:1px solid var(--border-1);padding:12px 32px;min-height:68px;box-sizing:border-box;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5\">\n      <div style=\"flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-size:11px -tr>\n                  <sc-raw-td style=\"font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">Total<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">{{ totals.meetings }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">{{ totals.opps }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">{{ totals.maybes }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">{{ totals.quotes }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">{{ totals.value }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700;border-top:2px solid var(--border-2)\">{{ totals.quotedValue }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fsection>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;align-items:start\">\n            <section style=\"background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-size:16px;font-variation-settings:'wdth' 112,'wght' 700\">Meetings by month<\u002Fspan>\n                <span style=\"font-size:12.5px;color:var(--fg-3)\">Opportunities in plum, other meetings in pink<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ months }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:13px\">\n                    <span style=\"color:var(--fg-2)\">{{ m.label }}<\u002Fspan>\n                    <span style=\"font-feature-settings:'tnum' 1;color:var(--fg-2)\">{{ m.summary }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"height:10px;border-radius:999px;background:var(--bg-3);overflow:hidden;display:flex\">\n                    <span style=\"display:block;height:100%;background:var(--nymbis-plum);width:{{ m.oppPct }}\"><\u002Fspan>\n                    <span style=\"display:block;height:100%;background:var(--nymbis-soft-pink);width:{{ m.restPct }}\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n\n            <section style=\"background:var(--nymbis-plum);border-radius:var(--radius-lg);padding:22px 24px;color:#fff;display:flex;flex-direction:column;gap:14px;min-width:0\">\n              <span style=\"font-size:16px;font-variation-settings:'wdth' 112,'wght' 700\">Largest quotes issued<\u002Fspan>\n              <sc-for list=\"{{ topOpps }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.2)\">\n                  <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3\">\n                    <span style=\"font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ o.customer }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:rgba(255,255,255,.6)\">{{ o.am }} Ã‚Â· {{ o.interest }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"flex:none;font-size:14px;font-feature-settings:'tnum' 1;font-variation-settings:'wdth' 112,'wght' 700\">{{ o.valueLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;'comfortable'|'compact'&quot;,&quot;section&quot;:&quot;Tables&quot;}}\">\nconst AMS = ['Account Manager'];\nconst INTERESTS = ['Backup and recovery', 'Disaster recovery', 'Cloud compute', 'Object storage', 'Data centre hosting', 'Microsoft 365 backup'];\n\nconst initials = (name) => name.split(/\\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();\nconst person = (name, role) => ({ name, role, initials: initials(name) });\n\nconst MEETINGS = [];\nconst OPP_TONE = { Yes: 'healthy', Maybe: 'atRisk', No: 'neutral' };\nconst OPP_LABEL = { Yes: 'Opportunity', Maybe: 'Maybe', No: 'No opportunity' };\n\nconst PERIODS = [\n  { label: 'This month', test: (m) => m.iso >= '2026-09-01', name: 'September 2026' },\n  { label: 'Last 90 days', test: (m) => m.iso >= '2026-06-11', name: 'Rolling 90 days to 09 Sep 2026' },\n  { label: 'All time', test: () => true, name: 'All recorded meetings' }\n];\n\nconst SCREENS = [\n  { id: 'dashboard', label: 'Dashboard', eyebrow: 'Vox reseller desk', title: 'Overview' },\n  { id: 'log', label: 'Meeting log', eyebrow: 'Meetings', title: 'Meeting log' },\n  { id: 'new', label: 'Log a meeting', eyebrow: 'Meetings', title: 'Log a meeting' },\n  { id: 'report', label: 'Management report', eyebrow: 'Vox management', title: 'Joint activity report' }\n];\n\nconst money = (n) => 'R ' + Math.round(n).toLocaleString('en-ZA').replace(/,/g, ' ');\nconst short = (n) => n >= 1000000 ? 'R ' + (n / 1000000).toFixed(1) + 'm' : n >= 1000 ? 'R ' + Math.round(n / 1000) + 'k' : money(n);\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'dashboard',\n    id: '',\n    query: '',\n    filter: 'All',\n    amFilter: 'All account managers',\n    period: 1,\n    extra: [],\n    attendeeDraft: '',\n    form: { am: 'Account Manager', customer: '', crm: '', date: '2026-09-09', time: '10:00', interest: 'Backup and recovery', opp: 'Yes', value: '', quoteNo: '', quoteValue: '', notes: '', attendees: [] }\n  };\n\n  go = (screen) => () => this.setState({ screen });\n  open = (id) => () => this.setState({ screen: 'detail', id });\n  setField = (k) => (e) => this.setState(s => ({ form: { ...s.form, [k]: e.target.value } }));\n\n  addAttendee = () => {\n    const v = this.state.attendeeDraft.trim();\n    if (!v) return;\n    this.setState(s => ({ attendeeDraft: '', form: { ...s.form, attendees: [...s.form.attendees, v] } }));\n  };\n\n  save = () => {\n    const f = this.state.form;\n    const d = new Date(f.date + 'T00:00:00');\n    const date = isNaN(d) ? f.date : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });\n    const num = (x) => parseFloat(String(x).replace(/[^0-9.]/g, '')) || 0;\n    const value = f.opp === 'No' ? 0 : num(f.value);\n    const m = {\n      id: 'n' + this.state.extra.length, iso: f.date, date, time: f.time,\n      am: f.am, customer: f.customer || 'Unnamed customer', crm: f.crm || 'Not captured',\n      opp: f.opp, value, quoteNo: f.quoteNo.trim(), quoteValue: f.quoteNo.trim() ? num(f.quoteValue) : 0,\n      interest: f.interest, channel: 'Not recorded',\n      attendees: (f.attendees.length ? f.attendees : ['Not recorded']).map(a => {\n        const [name, role] = a.split(/\\s*,\\s*/);\n        return person(name || a, role || 'Attendee');\n      }),\n      notes: f.notes ? f.notes.split('\\n').filter(Boolean) : ['No notes recorded.'],\n      next: []\n    };\n    this.setState(s => ({\n      extra: [m, ...s.extra], screen: 'log',\n      form: { ...s.form, customer: '', crm: '', value: '', quoteNo: '', quoteValue: '', notes: '', attendees: [] }\n    }));\n  };\n\n  renderVals() {\n    const p = this.props;\n    const st = this.state;\n    const screen = st.screen;\n    const active = SCREENS.find(s => s.id === screen);\n    const all = [...st.extra, ...MEETINGS];\n\n    const dec = (m) => ({\n      ...m,\n      attendeeCount: String(m.attendees.length),\n      oppTone: OPP_TONE[m.opp] || 'neutral',\n      oppLabel: OPP_LABEL[m.opp] || m.opp,\n      valueLabel: m.value ? money(m.value) : 'Ã¢â‚¬â€',\n      quoted: !!m.quoteNo,\n      quoteNoLabel: m.quoteNo || 'Ã¢â‚¬â€',\n      quoteValueLabel: m.quoteValue ? money(m.quoteValue) : 'Ã¢â‚¬â€',\n      open: this.open(m.id)\n    });\n\n    const q = st.query.trim().toLowerCase();\n    const decorated = all.map(dec);\n    const searched = decorated.filter(m => !q || (m.customer + ' ' + m.am + ' ' + m.crm + ' ' + m.interest).toLowerCase().includes(q));\n    const log = searched\n      .filter(m => st.filter === 'All' || (st.filter === 'Quoted' ? m.quoted : m.opp === st.filter))\n      .filter(m => st.amFilter === 'All account managers' || m.am === st.amFilter);\n\n    const detail = decorated.find(m => m.id === st.id) || decorated[0];\n    const detailFull = detail ? {\n      ...detail,\n      meta: [\n        { k: 'Vox account manager', v: detail.am },\n        { k: 'Customer', v: detail.customer },\n        { k: 'Vox CRM task', v: detail.crm },\n        { k: 'Date', v: detail.date },\n        { k: 'Time', v: detail.time },\n        { k: 'Attendees', v: detail.attendeeCount },\n        { k: 'Opportunity', v: detail.opp },\n        { k: 'Possible value', v: detail.valueLabel },\n        { k: 'Nymbis quote number', v: detail.quoteNoLabel },\n        { k: 'Quoted value', v: detail.quoteValueLabel }\n      ]\n    } : null;\n\n    const chip = (label, on, fn) => ({\n      label, go: fn,\n      bg: on ? 'var(--nymbis-plum)' : '#fff',\n      fg: on ? '#fff' : 'var(--fg-2)',\n      border: on ? 'var(--nymbis-plum)' : 'var(--border-1)'\n    });\n\n    const period = PERIODS[st.period];\n    const inPeriod = all.filter(period.test);\n    const opps = inPeriod.filter(m => m.opp === 'Yes');\n    const maybes = inPeriod.filter(m => m.opp === 'Maybe');\n    const quotedSet = inPeriod.filter(m => m.quoteNo);\n    const totalValue = inPeriod.filter(m => m.opp !== 'No').reduce((a, m) => a + m.value, 0);\n    const quotedValue = quotedSet.reduce((a, m) => a + m.quoteValue, 0);\n\n    const amRows = AMS.map(am => {\n      const mine = inPeriod.filter(m => m.am === am);\n      const o = mine.filter(m => m.opp === 'Yes');\n      const mb = mine.filter(m => m.opp === 'Maybe');\n      const qs = mine.filter(m => m.quoteNo);\n      const v = mine.filter(m => m.opp !== 'No').reduce((a, m) => a + m.value, 0);\n      const qv = qs.reduce((a, m) => a + m.quoteValue, 0);\n      return {\n        am, meetings: String(mine.length), opps: String(o.length), maybes: String(mb.length),\n        quotes: String(qs.length),\n        value: v ? money(v) : 'Ã¢â‚¬â€',\n        quotedValue: qv ? money(qv) : 'Ã¢â‚¬â€',\n        n: mine.length\n      };\n    }).sort((a, b) => b.n - a.n);\n\n    const maxMeetings = Math.max(1, ...amRows.map(r => r.n));\n\n    const monthKeys = [['2026-07', 'July 2026'], ['2026-08', 'August 2026'], ['2026-09', 'September 2026']];\n    const monthMax = Math.max(1, ...monthKeys.map(([k]) => all.filter(m => m.iso.startsWith(k)).length));\n    const months = monthKeys.map(([k, label]) => {\n      const set = all.filter(m => m.iso.startsWith(k));\n      const o = set.filter(m => m.opp === 'Yes').length;\n      return {\n        label,\n        summary: set.length + ' meetings Ã‚Â· ' + o + ' opportunities Ã‚Â· ' + short(set.filter(m => m.quoteNo).reduce((a, m) => a + m.quoteValue, 0)) + ' quoted',\n        oppPct: Math.round(o / monthMax * 100) + '%',\n        restPct: Math.round((set.length - o) / monthMax * 100) + '%'\n      };\n    });\n\n    const monthAll = all.filter(m => m.iso >= '2026-09-01');\n    const monthOpps = monthAll.filter(m => m.opp === 'Yes');\n    const monthLive = monthAll.filter(m => m.opp !== 'No');\n\n    return {\n      nav: SCREENS.map(s => {\n        const on = screen === s.id || (s.id === 'log' && screen === 'detail');\n        return {\n          label: s.label, go: this.go(s.id),\n          count: s.id === 'log' ? String(all.length) : '',\n          bg: on ? 'rgba(255,255,255,.10)' : 'transparent',\n          fg: on ? '#fff' : 'rgba(255,255,255,.62)',\n          bar: on ? 'var(--nymbis-red)' : 'transparent'\n        };\n      }),\n      eyebrow: screen === 'detail' ? 'Meetings' : (active ? active.eyebrow : ''),\n      title: screen === 'detail' && detail ? detail.customer : (active ? active.title : ''),\n\n      query: st.query,\n      setQuery: (e) => this.setState({ query: e.target.value }),\n\n      isDashboard: screen === 'dashboard',\n      isLog: screen === 'log',\n      isDetail: screen === 'detail',\n      isNew: screen === 'new',\n      isReport: screen === 'report',\n      goLog: this.go('log'),\n      goNew: this.go('new'),\n      goReport: this.go('report'),\n\n      rowPad: (p.density ?? 'comfortable') === 'compact' ? '8px' : '13px',\n\n      stats: [\n        { label: 'Meetings this month', value: String(all.filter(m => m.iso >= '2026-09-01').length), sub: 'Across ' + new Set(all.filter(m => m.iso >= '2026-09-01').map(m => m.am)).size + ' Vox account managers' },\n        { label: 'Opportunities', value: String(monthOpps.length), sub: monthAll.filter(m => m.opp === 'Maybe').length + ' more marked maybe' },\n        { label: 'Possible value', value: short(monthLive.reduce((a, m) => a + m.value, 0)), sub: 'Yes and maybe, before quoting' },\n        { label: 'Quoted value', value: short(monthAll.filter(m => m.quoteNo).reduce((a, m) => a + m.quoteValue, 0)), sub: monthAll.filter(m => m.quoteNo).length + ' Nymbis quotes issued' }\n      ],\n      recent: decorated.slice(0, 5),\n      amBars: amRows.filter(r => r.n > 0).map(r => ({ am: r.am, meetings: r.meetings, pct: Math.round(r.n / maxMeetings * 100) + '%' })),\n      openOpps: decorated.filter(m => m.opp !== 'No' && !m.quoteNo).slice(0, 5),\n\n      log,\n      logCount: log.length + ' of ' + all.length + ' meetings',\n      filters: [\n        chip('All', st.filter === 'All', () => this.setState({ filter: 'All' })),\n        chip('Yes', st.filter === 'Yes', () => this.setState({ filter: 'Yes' })),\n        chip('Maybe', st.filter === 'Maybe', () => this.setState({ filter: 'Maybe' })),\n        chip('No', st.filter === 'No', () => this.setState({ filter: 'No' })),\n        chip('Quoted', st.filter === 'Quoted', () => this.setState({ filter: 'Quoted' }))\n      ],\n      amNames: AMS,\n      amFilter: st.amFilter,\n      setAmFilter: (e) => this.setState({ amFilter: e.target.value }),\n\n      detail: detailFull,\n\n      interests: INTERESTS,\n      form: st.form,\n      setAm: this.setField('am'),\n      setCustomer: this.setField('customer'),\n      setCrm: this.setField('crm'),\n      setDate: this.setField('date'),\n      setTime: this.setField('time'),\n      setInterest: this.setField('interest'),\n      setValue: this.setField('value'),\n      setNotes: this.setField('notes'),\n      valueHelper: st.form.opp === 'No' ? 'Not required when there is no opportunity.' : 'Rough figure is fine. Firms up once a quote is issued.',\n      setQuoteNo: this.setField('quoteNo'),\n      setQuoteValue: this.setField('quoteValue'),\n      oppChoices: ['Yes', 'Maybe', 'No'].map(label => ({\n        label,\n        go: () => this.setState(s => ({ form: { ...s.form, opp: label } })),\n        ...(st.form.opp === label\n          ? { bg: 'var(--nymbis-plum)', fg: '#fff', border: 'var(--nymbis-plum)' }\n          : { bg: '#fff', fg: 'var(--fg-2)', border: 'var(--border-1)' })\n      })),\n      attendeeDraft: st.attendeeDraft,\n      setAttendeeDraft: (e) => this.setState({ attendeeDraft: e.target.value }),\n      attendeeKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.addAttendee(); } },\n      addAttendee: this.addAttendee,\n      attendeeChips: st.form.attendees.map((name, i) => ({\n        name,\n        remove: () => this.setState(s => ({ form: { ...s.form, attendees: s.form.attendees.filter((_, j) => j !== i) } }))\n      })),\n      save: this.save,\n\n      period: period.name,\n      periods: PERIODS.map((pd, i) => chip(pd.label, st.period === i, () => this.setState({ period: i }))),\n      reportStats: [\n        { label: 'Meetings', value: String(inPeriod.length), sub: 'Logged with Vox account managers' },\n        { label: 'Opportunities', value: String(opps.length), sub: maybes.length + ' more marked maybe' },\n        { label: 'Possible value', value: short(totalValue), sub: 'Yes and maybe, before quoting' },\n        { label: 'Quotes generated', value: String(quotedSet.length), sub: 'Nymbis quote numbers issued' },\n        { label: 'Quoted value', value: short(quotedValue), sub: 'Firm value quoted through Vox' }\n      ],\n      amRows,\n      totals: {\n        meetings: String(inPeriod.length),\n        opps: String(opps.length),\n        maybes: String(maybes.length),\n        quotes: String(quotedSet.length),\n        value: totalValue ? money(totalValue) : 'Ã¢â‚¬â€',\n        quotedValue: quotedValue ? money(quotedValue) : 'Ã¢â‚¬â€'\n      },\n      months,\n      topOpps: [...quotedSet].sort((a, b) => b.quoteValue - a.quoteValue).slice(0, 5).map(m => ({ customer: m.customer, am: m.am, interest: m.quoteNo, valueLabel: money(m.quoteValue) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
